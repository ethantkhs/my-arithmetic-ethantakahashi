name: CI

on:
  push:
    branches: ['**']   # tout push sur n'importe quelle branche
    tags: ['**']       # toute création de tag
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique + tags complets pour hatch-vcs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hatch
        run: pipx install hatch
      - name: Test
        run: hatch test --cover
      - name: Test
        run: hatch test --cover
      - name: Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          hatch run pip install coveralls
          hatch run coveralls

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hatch
        run: pipx install hatch
      - name: Build documentation
        run: hatch run docs:build

  deploy-stable:
    needs: tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hatch
        run: pipx install hatch
      - name: Deploy
        run: |
          hatch build
          echo "${{ github.event.repository.name }} deployment on stable servers"
          ls dist/

  deploy-develop:
    needs: tests
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hatch
        run: pipx install hatch
      - name: Deploy
        run: |
          hatch build
          echo "${{ github.event.repository.name }} deployment on develop servers"
          ls dist/