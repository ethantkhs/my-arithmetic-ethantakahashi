image: python:3.12

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: "0"   # clone complet : hatch-vcs a besoin de l'historique et des tags

cache:
  paths:
    - .cache/pip

stages:
  - test
  - deploy

default:
  before_script:
    - pip install hatch

tests:
  stage: test
  script:
    - hatch test --cover
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'

deploy-stable:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG                    # à chaque création de tag
  script:
    - hatch build
    - echo "$CI_PROJECT_NAME deployment on stable servers"
    - ls dist/

deploy-develop:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"    # à chaque push sur develop
  script:
    - hatch build
    - echo "$CI_PROJECT_NAME deployment on develop servers"
    - ls dist/