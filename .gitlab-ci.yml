image: python:3.12

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

tests:
  stage: test
  before_script:
    - pip install hatch
  script:
    - hatch test --cover
  # Récupère le pourcentage de la ligne "TOTAL ... 100%" pour le badge de couverture
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
